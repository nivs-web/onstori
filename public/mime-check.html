<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>녹화 형식 검사 — 온스토리</title>
<!--
  MediaRecorder 가 실제로 mp4 를 뱉는지 **실기기에서** 확인하는 검사판.
  isTypeSupported 가 true 라고 진짜 mp4 가 나오는 건 아니라서, 캔버스로 1.2초 녹화해
  파일 머리 4바이트(ftyp = MP4 / 1A 45 DF A3 = WebM)까지 읽는다.

  ⚠ 이 파일은 앱 코드가 아니라 public 의 정적 파일이다 — 번들에 안 들어가고 라우트도 안 만든다.
    확인이 끝나면 지워도 된다.
  주소: onstori.com/mime-check.html  (로컬은 localhost:3001/mime-check.html)
-->
<style>
  :root { color-scheme: light }
  body { margin:0; padding:20px 16px 48px; font:16px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif; color:#1a1a1a; background:#fafafa }
  h1 { font-size:21px; font-weight:700; letter-spacing:-.02em; margin:0 0 4px }
  .sub { color:#666; font-size:14px; margin:0 0 20px }
  button { width:100%; padding:16px; font-size:17px; font-weight:700; color:#fff; background:#005B2A; border:0; border-radius:12px; cursor:pointer }
  button:disabled { background:#9aa; }
  .verdict { margin:20px 0; padding:18px; border-radius:12px; text-align:center; font-size:20px; font-weight:700; line-height:1.4 }
  .ok { background:#e6f4ec; color:#005B2A }
  .no { background:#fdecec; color:#a11 }
  .wait { background:#eee; color:#555; font-size:16px; font-weight:500 }
  table { width:100%; border-collapse:collapse; margin-top:16px; font-size:14px }
  td { padding:7px 6px; border-bottom:1px solid #e5e5e5; vertical-align:top }
  td:first-child { font-family:ui-monospace,Consolas,monospace; font-size:12.5px; color:#444; word-break:break-all }
  td:last-child { width:52px; text-align:right; font-weight:700 }
  .y { color:#005B2A } .n { color:#bbb }
  pre { margin-top:16px; padding:12px; background:#fff; border:1px solid #e5e5e5; border-radius:10px; font-size:12px; line-height:1.55; white-space:pre-wrap; word-break:break-all; color:#333 }
  h2 { font-size:14px; color:#666; font-weight:600; margin:22px 0 0 }
</style>
</head>
<body>
<h1>녹화 형식 검사</h1>
<p class="sub">이 폰의 브라우저가 <b>mp4</b>로 녹화할 수 있는지 봅니다.<br>카메라 권한은 필요 없습니다.</p>

<button id="go">검사 시작</button>
<div id="verdict" class="verdict wait">아직 검사하지 않았습니다</div>

<h2>이 브라우저가 된다고 답한 형식</h2>
<table id="matrix"></table>

<h2>② 폰 기본 카메라로 찍으면 무슨 형식인가</h2>
<p class="sub" style="margin:6px 0 10px">
  누르면 폰 카메라 앱이 열립니다. <b>짧게(3초)</b> 찍고 확인을 누르세요.<br>
  아이폰은 .mov, 안드로이드는 .mp4 가 나올 겁니다 — 뭐가 나오는지 보려는 검사입니다.
</p>
<input id="cam" type="file" accept="video/*" capture="user" hidden>
<button id="camBtn" style="background:#273D3D">카메라로 찍어 보기</button>
<div id="camVerdict" class="verdict wait">아직 찍지 않았습니다</div>

<h2>자세한 결과 (그대로 복사해서 보내 주세요)</h2>
<pre id="raw">—</pre>

<script>
// 우리 앱(app/rec/[slug]/rec-client.tsx pickMime)과 **같은 순서**여야 의미가 있다
var CANDIDATES = [
  "video/mp4;codecs=avc1",
  "video/webm;codecs=vp9,opus",
  "video/webm;codecs=vp8,opus",
  "video/webm",
  "video/mp4"
];
// 참고용으로만 더 넓게 본다
var EXTRA = ["video/mp4;codecs=avc1.42E01E", "video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4;codecs=h264", "video/quicktime"];

function supported(m) {
  try { return typeof MediaRecorder !== "undefined" && MediaRecorder.isTypeSupported(m); }
  catch (e) { return false; }
}

function drawMatrix() {
  var rows = "";
  CANDIDATES.concat(EXTRA).forEach(function (m) {
    var ok = supported(m);
    rows += '<tr><td>' + m + '</td><td class="' + (ok ? "y" : "n") + '">' + (ok ? "예" : "아니오") + "</td></tr>";
  });
  document.getElementById("matrix").innerHTML = rows;
}
drawMatrix();

function pick() {
  for (var i = 0; i < CANDIDATES.length; i++) if (supported(CANDIDATES[i])) return CANDIDATES[i];
  return "";
}

document.getElementById("go").onclick = async function () {
  var btn = this, v = document.getElementById("verdict");
  btn.disabled = true; btn.textContent = "녹화 중… 2초";
  v.className = "verdict wait"; v.textContent = "검사하는 중…";

  var out = {
    브라우저: navigator.userAgent,
    고른형식: pick() || "(없음 — 브라우저 기본값)"
  };

  try {
    if (typeof MediaRecorder === "undefined") throw new Error("이 브라우저에는 MediaRecorder 가 없습니다");

    // 카메라 대신 캔버스를 찍는다 — 권한 창이 안 뜨고 결과는 같다
    var cv = document.createElement("canvas");
    cv.width = 180; cv.height = 320;
    var cx = cv.getContext("2d"), hue = 0;
    var iv = setInterval(function () { cx.fillStyle = "hsl(" + (hue += 20) + ",70%,50%)"; cx.fillRect(0, 0, 180, 320); }, 60);

    var stream = cv.captureStream(24);
    var mime = pick();
    var rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    var chunks = [];
    rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    var stopped = new Promise(function (r) { rec.onstop = r; });
    rec.start();
    await new Promise(function (r) { setTimeout(r, 1500); });
    rec.stop();
    await stopped;
    clearInterval(iv);
    stream.getTracks().forEach(function (t) { t.stop(); });

    var blob = new Blob(chunks, { type: rec.mimeType || "" });
    var head = new Uint8Array(await blob.slice(0, 16).arrayBuffer());
    var ascii = "";
    for (var i = 0; i < head.length; i++) ascii += (head[i] > 31 && head[i] < 127) ? String.fromCharCode(head[i]) : ".";

    var isMp4 = ascii.indexOf("ftyp") >= 0;
    var isWebm = head[0] === 0x1a && head[1] === 0x45 && head[2] === 0xdf && head[3] === 0xa3;

    out.실제로_찍힌_형식 = rec.mimeType || "(빈값)";
    out.파일머리 = ascii;
    out.파일크기바이트 = blob.size;
    out.판정 = isMp4 ? "진짜 MP4" : isWebm ? "WebM" : "알 수 없음";

    // 진짜 확인 — 이 폰이 방금 만든 파일을 **재생**까지 하는지
    var vid = document.createElement("video");
    vid.muted = true; vid.playsInline = true;
    var url = URL.createObjectURL(blob);
    vid.src = url;
    out.자기가만든걸재생 = await new Promise(function (res) {
      var t = setTimeout(function () { res("확인 실패(시간초과)"); }, 4000);
      vid.onloadedmetadata = function () { clearTimeout(t); res("가능 (" + vid.videoWidth + "x" + vid.videoHeight + ")"); };
      vid.onerror = function () { clearTimeout(t); res("불가"); };
    });
    URL.revokeObjectURL(url);

    if (isMp4) { v.className = "verdict ok"; v.textContent = "✅ mp4 로 녹화됩니다\n변환 없이 아이폰에서도 재생됩니다"; }
    else if (isWebm) { v.className = "verdict no"; v.textContent = "⚠ webm 으로 녹화됩니다\n아이폰에서 재생되려면 변환이 필요합니다"; }
    else { v.className = "verdict no"; v.textContent = "❓ 형식을 알 수 없습니다"; }
  } catch (e) {
    out.오류 = String(e);
    v.className = "verdict no"; v.textContent = "검사하지 못했습니다";
  }

  document.getElementById("raw").textContent = JSON.stringify(out, null, 2);
  btn.disabled = false; btn.textContent = "다시 검사";
};

/* ── ② 폰 기본 카메라 경로 (input capture) ──
   V-4 에서 쓸 폴백이다. 여기서는 **무슨 파일이 나오는지 보기만** 한다.
   아이폰은 보통 .mov(HEVC 일 수 있다), 안드로이드는 .mp4 가 나온다.
   HEVC 로 나오면 안드로이드 손님이 못 볼 수 있어 변환이 필요하다 — 그걸 미리 알아두려는 검사다. */
var cam = document.getElementById("cam");
document.getElementById("camBtn").onclick = function () { cam.click(); };
cam.onchange = async function () {
  var f = cam.files && cam.files[0];
  var v = document.getElementById("camVerdict");
  if (!f) { v.className = "verdict wait"; v.textContent = "취소했습니다"; return; }

  var head = new Uint8Array(await f.slice(0, 24).arrayBuffer());
  var ascii = "";
  for (var i = 0; i < head.length; i++) ascii += (head[i] > 31 && head[i] < 127) ? String.fromCharCode(head[i]) : ".";
  // ftyp 바로 뒤 4글자가 브랜드다: isom/mp42 = 흔한 mp4, qt = 애플 .mov, hev1/hvc1 = HEVC
  var brand = ascii.indexOf("ftyp") >= 0 ? ascii.substr(ascii.indexOf("ftyp") + 4, 4) : "(없음)";

  var vid = document.createElement("video");
  vid.muted = true; vid.playsInline = true;
  var url = URL.createObjectURL(f);
  vid.src = url;
  var playable = await new Promise(function (res) {
    var t = setTimeout(function () { res("확인 실패(시간초과)"); }, 5000);
    vid.onloadedmetadata = function () { clearTimeout(t); res("가능 (" + vid.videoWidth + "x" + vid.videoHeight + ", " + Math.round(vid.duration) + "초)"); };
    vid.onerror = function () { clearTimeout(t); res("불가"); };
  });
  URL.revokeObjectURL(url);

  var prev = {};
  try { prev = JSON.parse(document.getElementById("raw").textContent); } catch (e) {}
  prev.카메라_파일명 = f.name;
  prev.카메라_형식 = f.type || "(빈값)";
  prev.카메라_크기MB = (f.size / 1048576).toFixed(1);
  prev.카메라_브랜드 = brand;
  prev.카메라_이폰에서재생 = playable;
  document.getElementById("raw").textContent = JSON.stringify(prev, null, 2);

  var mp4ish = /isom|mp42|mp41|avc1/i.test(brand);
  v.className = "verdict " + (mp4ish ? "ok" : "no");
  v.textContent = (mp4ish ? "✅ mp4 계열" : "⚠ mp4 가 아님") + "\n" + (f.type || "형식 표시 없음") + " · " + brand;
};
</script>
</body>
</html>
